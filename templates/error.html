{% extends "base.html" %}

{% block title %}Error - ¿Quién Quiere Ser Sevillano?{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-box">
        <div class="error-icon">⚠️</div>
        <h1>Oops, algo salió mal</h1>
        <p class="error-message">{{ error }}</p>
        
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                ← Volver al Inicio
            </a>
            {% if 'user_id' in session %}
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                📊 Ir al Dashboard
            </a>
            {% endif %}
        </div>
    </div>
</div>

<style>
    .error-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 20px;
    }

    .error-box {
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 40px;
        text-align: center;
        max-width: 500px;
    }

    .error-icon {
        font-size: 60px;
        margin-bottom: 20px;
    }

    .error-box h1 {
        color: #f44336;
        margin: 0 0 15px 0;
    }

    .error-message {
        color: #666;
        margin: 0 0 30px 0;
        line-height: 1.6;
    }

    .error-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }
</style>
{% endblock %}
